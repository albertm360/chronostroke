name: Build

# Validates every push to main and every pull request aimed at it. Without this
# nothing checks that main compiles until someone cuts a release, at which point
# the release is the thing that fails.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # Pinned to commit SHAs for the same reason as release.yml: a tag can be
      # moved to point at different code after the fact, a SHA cannot.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The csproj <Version> is a development placeholder — release.yml stamps the
      # real one from the tag — but a placeholder nobody checks is a placeholder
      # that rots, and this one sat at 1.1.0 through two releases. Holding it to
      # the newest changelog heading gives it a rule that can actually be applied:
      # the heading is written before the release, so the two move together.
      - name: Check the version matches the newest changelog section
        shell: pwsh
        run: |
          $csproj = 'ChronoStroke/ChronoStroke.csproj'
          $version = ([xml](Get-Content $csproj)).Project.PropertyGroup.Version |
              Where-Object { $_ }
          if (-not $version) { throw "No <Version> found in $csproj." }

          # First heading wins: the changelog is newest-first, and Unreleased is
          # skipped because it is a holding area rather than a version.
          $heading = Get-Content CHANGELOG.md |
              Select-String -Pattern '^## \[(\d+\.\d+\.\d+)\]' |
              Select-Object -First 1
          if (-not $heading) { throw 'CHANGELOG.md has no released version section.' }
          $newest = $heading.Matches[0].Groups[1].Value

          if ($version -ne $newest) {
              throw "csproj <Version> is $version but the newest CHANGELOG.md section is $newest."
          }
          Write-Output "Version $version matches the newest changelog section."

      # -warnaserror because the project builds clean today. A warning arriving
      # in CI is a warning nobody will read, and the count only ever grows.
      #
      # Kept here as well as in Directory.Build.props. The props file is what makes
      # the gate felt while writing the code; this flag is the workflow stating its
      # own requirement, so editing that file cannot quietly switch CI's gate off.
      - name: Build
        run: dotnet build --configuration Release -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build

      # A downloadable build for every push and pull request, so trying a change
      # out on the machine does not require cutting a release. Releases are for
      # users, who have to find the page, clear SmartScreen and replace their copy
      # by hand; these are for me. Without them the only way to get a binary was to
      # publish one publicly, which is what makes releasing every merge tempting.
      #
      # Publish rather than reusing the build output above: the thing worth trying
      # is the single-file self-contained exe people actually run, and that shape
      # only exists after publish.
      #
      # --no-build so the artifact is the assembly the tests just ran against
      # rather than a second invocation of the compiler, and to match the test
      # step above. The time saved is not the point: measured at 4.70s against
      # 4.04s, since the incremental build was already skipping the compile.
      - name: Publish single-file executable
        run: dotnet publish --configuration Release --no-build

      - name: Upload the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The commit is in the name because the version inside the exe is not a
          # reliable answer here: the csproj carries a development placeholder and
          # only release.yml stamps the real one from the tag.
          #
          # head.sha rather than github.sha, which on a pull request is the synthetic
          # merge commit GitHub builds for the run — a SHA that is not in anyone's
          # history and cannot be checked out, which defeats the point of naming the
          # file after it. On a push there is no pull_request and it falls through.
          name: ChronoStroke-${{ github.event.pull_request.head.sha || github.sha }}
          path: ChronoStroke/bin/Release/net10.0-windows/win-x64/publish/ChronoStroke.exe
          # Throwaway test builds, not archives. The 90-day default would keep 61 MB
          # per run long after the commit stopped being interesting.
          retention-days: 14
          # A silent empty artifact would be worse than a failure — it looks like a
          # successful build you can download, right up until you try.
          if-no-files-found: error
