# release.yml pins its actions to commit SHAs, which is only safe if something
# raises the bumps — otherwise the pins quietly rot. This is that something.
#
# No target-branch on either ecosystem: main is the only long-lived branch, so
# Dependabot's default — the repository's default branch — is already right.
# Note that Dependabot reads this file from the default branch only, so a change
# here has no effect until it reaches main.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
